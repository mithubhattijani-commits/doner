# ONE-TIME use only — day-1 keystore recovery (Jaani's standing order, 31 Oct 2026).
# Trigger MANUALLY (Actions tab → "Recover day-1 keystore" → Run workflow)
# ONLY AFTER the GitHub Actions free-minutes quota has reset (Nov 1).
# What it does:
#   1. Decodes this repo's KEYSTORE_BASE64 Actions secret into keystore-day1.jks
#   2. Prints the SHA-256 fingerprint via keytool (compare with the recorded value)
#   3. Saves KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD to passwords.txt
#   4. Uploads both as a PRIVATE repo artifact (7-day retention)
# After downloading: make the encrypted Drive backup (GitHub Actions secrets stay as the working copy),
# then DELETE this workflow file and the artifact from GitHub.
# GitHub masks secret values in logs; the .jks + passwords live only in the artifact.
# Expected day-1 signer SHA-256 (doner): F2:C1:7E:57:5F:76:68:3C:67:D3:16:D1:DE:8F:14:0C:65:21:AF:DA:CC:1C:17:D6:41:20:F7:8A:20:AA:83:9E  (recorded day-1 signer SHA-256 for this repo)
name: Recover day-1 keystore (one-time)

on:
  workflow_dispatch: {}

jobs:
  recover-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from Actions secret
        run: |
          set -e
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "KEYSTORE_BASE64 secret is empty"; exit 1; }
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore-day1.jks
          ls -l keystore-day1.jks
      - name: Print SHA-256 fingerprint for verification
        run: |
          keytool -list -v -keystore keystore-day1.jks \
            -storepass "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
            | grep -E "Alias name|SHA256:"
      - name: Save passwords to passwords.txt
        run: |
          {
            echo "KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }}"
            echo "KEYSTORE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}"
          } > passwords.txt
          chmod 600 keystore-day1.jks passwords.txt
          wc -c keystore-day1.jks passwords.txt
      - name: Upload recovery bundle (private artifact, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: day1-keystore-doner
          path: |
            keystore-day1.jks
            passwords.txt
          retention-days: 7
